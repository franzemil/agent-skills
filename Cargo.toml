[package]
name = "agent-skills"
version = "0.1.0"
edition = "2021"
description = "Cross-harness skill/subagent installer with a TUI (pi, Claude Code, opencode)"
license = "MIT"

[[bin]]
name = "agent-skills"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
walkdir = "2"

[profile.release]
lto = true
strip = true
